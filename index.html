<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BR Business · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',sans-serif;background:#0C1E35;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
.brand{text-align:center;margin-bottom:40px;}
.brand-logo{font-family:'Playfair Display',serif;font-size:40px;font-weight:700;color:#E8B86A;letter-spacing:-0.5px;}
.brand-sub{font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-top:8px;}
.card{background:#142438;border:1px solid rgba(232,184,106,0.2);border-radius:22px;padding:34px 28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.card-title{font-size:18px;font-weight:800;color:white;margin-bottom:6px;letter-spacing:-0.2px;}
.card-sub{font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:32px;line-height:1.6;}
.pin-display{display:flex;gap:16px;justify-content:center;margin-bottom:34px;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);background:transparent;transition:all 0.15s;}
.pin-dot.filled{background:#E8B86A;border-color:#E8B86A;box-shadow:0 0 10px rgba(232,184,106,0.5);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.num{padding:20px;border-radius:14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.08);color:white;font-size:22px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.1s;font-family:'Inter',sans-serif;user-select:none;letter-spacing:0;}
.num:active{background:rgba(232,184,106,0.25);border-color:rgba(232,184,106,0.5);transform:scale(0.94);}
.num.ctrl{font-size:12px;font-weight:800;color:rgba(255,255,255,0.35);letter-spacing:0.05em;}
.err{min-height:22px;text-align:center;margin-top:16px;font-size:13px;font-weight:700;letter-spacing:0.02em;}
.err.bad{color:#FF6B6B;}
.err.info{color:rgba(255,255,255,0.35);}
.loading{display:none;text-align:center;padding:40px 20px;}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,0.08);border-top-color:#E8B86A;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.version{font-size:11px;color:rgba(255,255,255,0.15);text-align:center;margin-top:28px;font-weight:600;letter-spacing:0.06em;}
</style>
</head>
<body>

<div class="brand">
  <div class="brand-logo">BR Business</div>
  <div class="brand-sub">Advisory System · Babu Raj</div>
</div>

<div class="card" id="mainCard">
  <div class="card-title">Enter Your PIN</div>
  <div class="card-sub">4-digit PIN to access your business system</div>
  <div class="pin-display">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="numpad">
    <div class="num" onclick="k('1')">1</div>
    <div class="num" onclick="k('2')">2</div>
    <div class="num" onclick="k('3')">3</div>
    <div class="num" onclick="k('4')">4</div>
    <div class="num" onclick="k('5')">5</div>
    <div class="num" onclick="k('6')">6</div>
    <div class="num" onclick="k('7')">7</div>
    <div class="num" onclick="k('8')">8</div>
    <div class="num" onclick="k('9')">9</div>
    <div class="num ctrl" onclick="k('C')">CLEAR</div>
    <div class="num" onclick="k('0')">0</div>
    <div class="num ctrl" onclick="k('DEL')">⌫</div>
  </div>
  <div class="err info" id="errMsg">Ready</div>
</div>

<div class="loading" id="loadDiv">
  <div class="spinner"></div>
  <div style="font-size:14px;color:rgba(255,255,255,0.5);font-weight:600;">Opening your system...</div>
</div>

<div class="version" id="ver">Loading...</div>

<!--
  config.js is loaded as a normal script tag.
  It runs synchronously so BR_CONFIG is always
  available before the PIN check runs.
  The ?ts= cache-buster ensures the latest
  version is always fetched from GitHub.
-->
<script>
  // Inject config.js with a timestamp cache-buster
  // This guarantees the browser never uses a stale cached version
  var s = document.createElement('script');
  s.src = 'config.js?ts=' + Math.floor(Date.now() / 30000); // refreshes every 30 seconds
  s.onerror = function() {
    document.getElementById('errMsg').textContent = 'Could not load config — check internet connection';
    document.getElementById('errMsg').className = 'err bad';
  };
  s.onload = function() {
    // Config loaded successfully
    var ver = (window.BR_CONFIG && window.BR_CONFIG.VERSION) ? 'v' + BR_CONFIG.VERSION : '';
    document.getElementById('ver').textContent = ver;
    document.getElementById('errMsg').textContent = 'Enter your PIN';
    document.getElementById('errMsg').className = 'err info';

    // Check for existing valid session (within 8 hours)
    var lastLogin = parseInt(localStorage.getItem('br_login_time') || '0');
    var sessionAge = Date.now() - lastLogin;
    if (localStorage.getItem('br_auth') === 'ok' && sessionAge < 8 * 60 * 60 * 1000) {
      launch();
    }
  };
  document.head.appendChild(s);
</script>

<script>
var pin = '';

function k(key) {
  // Guard: config must be loaded
  if (!window.BR_CONFIG) {
    document.getElementById('errMsg').textContent = 'Still loading — please wait a moment';
    document.getElementById('errMsg').className = 'err info';
    return;
  }

  if (key === 'C')        { pin = ''; }
  else if (key === 'DEL') { pin = pin.slice(0, -1); }
  else if (pin.length < 4){ pin += key; }

  // Update dots
  for (var i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < pin.length);
  }

  // Clear error when typing
  if (key !== 'C') {
    document.getElementById('errMsg').textContent = pin.length > 0 ? '· '.repeat(pin.length) : 'Enter your PIN';
    document.getElementById('errMsg').className = 'err info';
  }

  // Check when 4 digits entered
  if (pin.length === 4) {
    setTimeout(check, 100);
  }
}

function check() {
  var correct = String(BR_CONFIG.PIN);
  var entered = String(pin);

  if (entered === correct) {
    // Success
    localStorage.setItem('br_auth', 'ok');
    localStorage.setItem('br_login_time', Date.now().toString());
    launch();
  } else {
    // Wrong PIN
    document.getElementById('errMsg').textContent = 'Incorrect PIN — try again';
    document.getElementById('errMsg').className = 'err bad';

    // Shake card
    var card = document.getElementById('mainCard');
    var shakes = [8, -8, 6, -6, 4, -4, 0];
    var i = 0;
    var shake = setInterval(function() {
      card.style.transform = 'translateX(' + shakes[i] + 'px)';
      i++;
      if (i >= shakes.length) {
        clearInterval(shake);
        card.style.transform = '';
      }
    }, 50);

    // Reset PIN
    pin = '';
    for (var j = 0; j < 4; j++) {
      document.getElementById('d' + j).classList.remove('filled');
    }
  }
}

function launch() {
  document.getElementById('mainCard').style.opacity = '0';
  document.getElementById('mainCard').style.transition = 'opacity 0.3s';
  document.querySelector('.brand').style.opacity = '0';
  document.querySelector('.brand').style.transition = 'opacity 0.3s';
  setTimeout(function() {
    document.getElementById('mainCard').style.display = 'none';
    document.querySelector('.brand').style.display = 'none';
    document.getElementById('loadDiv').style.display = 'block';
  }, 300);
  setTimeout(function() {
    window.location.href = 'today.html';
  }, 700);
}
</script>

</body>
</html>
