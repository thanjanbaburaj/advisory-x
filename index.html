<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BR Business · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',sans-serif;background:#0C1E35;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.brand{text-align:center;margin-bottom:40px;}
.brand-logo{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;color:#E8B86A;letter-spacing:-0.5px;}
.brand-sub{font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-top:6px;}
.card{background:#142438;border:1px solid rgba(232,184,106,0.15);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;}
.card-title{font-size:17px;font-weight:700;color:white;margin-bottom:6px;}
.card-sub{font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:28px;line-height:1.6;}
.pin-display{display:flex;gap:14px;justify-content:center;margin-bottom:32px;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);background:transparent;transition:all 0.15s;}
.pin-dot.filled{background:#E8B86A;border-color:#E8B86A;box-shadow:0 0 8px rgba(232,184,106,0.4);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.num{padding:18px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:white;font-size:22px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.12s;font-family:'Inter',sans-serif;user-select:none;}
.num:active{background:rgba(232,184,106,0.2);border-color:rgba(232,184,106,0.4);transform:scale(0.96);}
.num.del{font-size:13px;font-weight:700;color:rgba(255,255,255,0.5);}
.err{color:#FF6B6B;font-size:13px;font-weight:600;text-align:center;margin-top:14px;min-height:20px;letter-spacing:0.02em;}
.loading{display:none;text-align:center;padding:20px;}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.08);border-top-color:#E8B86A;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.version{font-size:11px;color:rgba(255,255,255,0.2);text-align:center;margin-top:24px;}
</style>
</head>
<body>

<div class="brand">
  <div class="brand-logo">BR Business</div>
  <div class="brand-sub">Advisory System · Babu Raj</div>
</div>

<div class="card" id="mainCard">
  <div class="card-title">Enter Your PIN</div>
  <div class="card-sub">4-digit PIN to access your business system</div>
  <div class="pin-display">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="numpad">
    <div class="num" onclick="k('1')">1</div>
    <div class="num" onclick="k('2')">2</div>
    <div class="num" onclick="k('3')">3</div>
    <div class="num" onclick="k('4')">4</div>
    <div class="num" onclick="k('5')">5</div>
    <div class="num" onclick="k('6')">6</div>
    <div class="num" onclick="k('7')">7</div>
    <div class="num" onclick="k('8')">8</div>
    <div class="num" onclick="k('9')">9</div>
    <div class="num" onclick="k('C')" style="font-size:12px;color:rgba(255,255,255,0.4);">Clear</div>
    <div class="num" onclick="k('0')">0</div>
    <div class="num del" onclick="k('DEL')">⌫</div>
  </div>
  <div class="err" id="errMsg"></div>
</div>

<div class="loading" id="loadDiv">
  <div class="spinner"></div>
  <div style="font-size:14px;color:rgba(255,255,255,0.6);">Opening your system...</div>
</div>

<div class="version" id="versionStr"></div>

<script>
// Load config fresh every time using cache-bust
(function(){
  const s = document.createElement('script');
  s.src = 'config.js?v=' + Date.now();
  s.onload = function() {
    document.getElementById('versionStr').textContent = 'v' + (BR_CONFIG.VERSION||'1.0');
    // Auto-login if session still valid (within 8 hours)
    const last = parseInt(localStorage.getItem('br_login_time')||0);
    const age  = Date.now() - last;
    if (age < 8*60*60*1000 && localStorage.getItem('br_auth')==='ok') {
      launch();
    }
  };
  document.head.appendChild(s);
})();

let pin='';

function k(key) {
  if (key==='C')   { pin=''; }
  else if (key==='DEL') { pin=pin.slice(0,-1); }
  else if (pin.length<4) { pin+=key; }
  // Update dots
  for(let i=0;i<4;i++){
    document.getElementById('d'+i).classList.toggle('filled', i<pin.length);
  }
  document.getElementById('errMsg').textContent='';
  if (pin.length===4) {
    setTimeout(()=>check(), 80);
  }
}

function check() {
  if (!window.BR_CONFIG) {
    document.getElementById('errMsg').textContent='Config loading — please wait';
    pin=''; updateDots(); return;
  }
  if (pin===BR_CONFIG.PIN) {
    localStorage.setItem('br_auth','ok');
    localStorage.setItem('br_login_time', Date.now().toString());
    launch();
  } else {
    document.getElementById('errMsg').textContent='Incorrect PIN — try again';
    // Shake animation
    const card=document.getElementById('mainCard');
    card.style.animation='none';
    card.style.transform='translateX(6px)';
    setTimeout(()=>{card.style.transform='translateX(-6px)';},80);
    setTimeout(()=>{card.style.transform='';card.style.transition='transform 0.15s';},160);
    setTimeout(()=>{card.style.transition='';},300);
    pin='';
    for(let i=0;i<4;i++) document.getElementById('d'+i).classList.remove('filled');
  }
}

function launch() {
  document.getElementById('mainCard').style.display='none';
  document.querySelector('.brand').style.display='none';
  document.getElementById('loadDiv').style.display='block';
  setTimeout(()=>{ window.location.href='today.html?v='+Date.now(); },600);
}
</script>
</body>
</html>
